<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический магазин — команда 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🚀 Космический магазин</h1>
        <p>Собери корзину для полёта!</p>
    </header>

    <main>
        <section id="catalog">
            <h2>Каталог</h2>
            <div class="products-grid">
                <div class="product-card">
                    <h3>Космический батончик</h3>
                    <p class="price">100 ₽</p>
                    <button class="add-btn" data-id="bar" data-name="Космический батончик" data-price="100">Добавить</button>
                </div>
                <div class="product-card">
                    <h3>Книга по JS</h3>
                    <p class="price">200 ₽</p>
                    <button class="add-btn" data-id="book" data-name="Книга по JS" data-price="200">Добавить</button>
                </div>
                <div class="product-card">
                    <h3>Настольная игра</h3>
                    <p class="price">50 ₽</p>
                    <button class="add-btn" data-id="game" data-name="Настольная игра" data-price="50">Добавить</button>
                </div>
            </div>
        </section>

        <section id="cart-section">
            <h2>Корзина</h2>
            <ul id="cart-list"></ul>
            <div id="cart-total">
                Итого: <span id="total-price">0</span> ₽
            </div>

            <div id="promo-container">
                <input type="text" id="promo-input" placeholder="Промокод (DEEPSEEK)">
                <button id="promo-btn">Применить</button>
            </div>
            <p id="promo-message"></p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
