<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический магазин — команда 3</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🚀 Космический магазин</h1>
        <p>Собери корзину для полёта!</p>
    </header>

    <main>
        <section id="catalog-section" aria-labelledby="catalog-title">
            <h2 id="catalog-title">Каталог</h2>

            <div id="catalog-controls" class="catalog-controls">
                <input type="search" id="search-input" placeholder="Поиск по названию…"
                       aria-label="Поиск товаров по названию" autocomplete="off">
                <select id="category-select" aria-label="Фильтр по категории">
                    <option value="all">Все категории</option>
                </select>
                <select id="sort-select" aria-label="Сортировка по цене">
                    <option value="default">Без сортировки</option>
                    <option value="asc">Цена: сначала дешевле</option>
                    <option value="desc">Цена: сначала дороже</option>
                </select>
                <button type="button" id="favorites-toggle" aria-pressed="false">♡ Избранное</button>
                <button type="button" id="reset-filters" class="secondary" hidden>Сбросить фильтры</button>
            </div>

            <p id="catalog-empty" class="empty-message" hidden>Ничего не найдено — измените поиск или фильтры.</p>
            <div id="products-grid" class="products-grid"></div>
        </section>

        <section id="cart-section" aria-labelledby="cart-title">
            <h2 id="cart-title">Корзина</h2>
            <p id="cart-empty" class="empty-message">Корзина пуста</p>
            <ul id="cart-list"></ul>

            <div id="cart-total" class="cart-total" aria-live="polite">
                Итого: <span id="total-price">0</span> ₽
            </div>

            <div id="promo-container">
                <input type="text" id="promo-input" placeholder="Промокод"
                       aria-label="Промокод" autocomplete="off">
                <button type="button" id="promo-btn">Применить</button>
            </div>
            <p id="promo-message" role="status"></p>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
